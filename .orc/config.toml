# Checks for parley.
#
# `emacs -Q --batch` and never the operator's own Emacs: a check that asked a
# running server would answer differently on every machine. Both commands glob
# rather than name files, so an empty tree is a pass and adding a file needs no
# edit here.
#
# The straight build directory is on the load path because `-Q` supplies nothing
# and parley requires markdown-mode. It is a path rather than a fetch on purpose:
# a check that installed a package would need the network to go green.
#
# `-l bytecomp` comes before the `--eval` and has to. `--eval` evaluates
# lexically, so a `let` over `byte-compile-error-on-warn` before anything has
# defined it binds a LEXICAL variable -- and the `defcustom` that runs when
# `byte-compile-file` then pulls bytecomp in refuses to redefine one as dynamic.
# The compiler never runs and emacs exits 255.

[repo]
target = "master"

[checks.compile]
commands = [
  '''emacs -Q --batch -L . -L "$HOME/.emacs.d/straight/build/markdown-mode" -l bytecomp --eval '(let ((byte-compile-error-on-warn t)) (mapc (quote byte-compile-file) (file-expand-wildcards "*.el" t)))' ''',
]

[checks.test]
commands = [
  '''emacs -Q --batch -L . -L "$HOME/.emacs.d/straight/build/markdown-mode" --eval '(dolist (f (file-expand-wildcards "test/*.el" t)) (load f))' -f ert-run-tests-batch-and-exit''',
]

[roles]
inner   = ["compile"]
handoff = ["compile", "test"]
merge   = ["compile", "test"]
